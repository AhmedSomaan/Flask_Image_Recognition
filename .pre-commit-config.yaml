repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: .venv/Scripts/python.exe -m pylint
        language: system
        types: [python]
        args: [--rcfile=.pylintrc]

      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -B -m pytest
        language: system
        pass_filenames: false
        always_run: true
